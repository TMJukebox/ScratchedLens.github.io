<style>
  /* one-page-only: the taskbar now holds many live window buttons */
  .taskbar-links { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
  .taskbar-links .btn-task {
    font: inherit;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    min-width: 34px;
    max-width: 190px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .taskbar-links .btn-task.active { border-style: inset; }
  #start-menu li a { display: block; padding: 4px 6px; text-decoration: none; color: inherit; }
  #start-menu li a:hover { background: var(--win-navy); color: #fff; }
</style>

<template id="tpl-about"

          data-w="560" data-h="430" data-tab="📼 About_Me.exe">

  <p>
    Hello! my name is Aden and I am a Graduate from the University of Texas at San Antonio with a degree in computer science.
    I build websites for commercial, non-profit, and personal projects. but also i love to play video games, heading to the movies (shoutout araiana for always being down to see something), and seeing live music.
  </p>
  <p>
    I care about community, showcasing local talent and unheard voices.
    Quotes for commercial and non-profit work are available upon request. if you want to get in touch, please use the contact form on this site or email me directly at <a href="mailto:adenmrojas@gmail.com">adenmrojas@gmail.com</a>.
  </p>
  <hr class="tape">
  <h2>what i do</h2>
  <ul>
    <li>static and or dynamic websites with different levels of interactivity</li>
    <li>live show &amp; event photography</li>
    <li>band promo shoots</li>
    <li>short recap / highlight video</li>
  </ul>
  <hr class="tape">
  <p>
    <span class="sticker pink">est. [2021]</span>
    <span class="sticker blue">[San Antonio,Tx]</span>

<template id="tpl-contact"
          data-title="CONTACT — Outlook Express" data-tb="tb-green"
          data-w="520" data-h="470" data-tab="✉️ Contact.exe">
  <h1>get in touch</h1>
  <p>booking a shoot, need a site built, or just want to say hi:</p>
  <div class="field-row-stacked" style="margin-bottom:10px;">
    <label for="spa-email">email</label>
    <input id="spa-email" type="text" readonly value="adenmrojas@gmail.com">
  </div>
  <p>
    <span class="sticker pink">Instagram @yourhandle</span>
    <span class="sticker blue">Bandcamp / portfolio link</span>
  </p>
  <hr class="tape">
  <form action="mailto:adenmrojas@gmail.com" method="post" enctype="text/plain">
    <div class="field-row-stacked">
      <label for="spa-name">name</label>
      <input id="spa-name" name="name" type="text">
    </div>
    <div class="field-row-stacked">
      <label for="spa-reason">what do you need?</label>
      <select id="spa-reason" name="reason">
        <option>Photo / video booking</option>
        <option>Website project</option>
        <option>Just saying hi</option>
      </select>
    </div>
    <div class="field-row-stacked">
      <label for="spa-message">message</label>
      <textarea id="spa-message" name="message" rows="5"></textarea>
    </div>
    <button type="submit">send message</button>
  </form>
</template>
